name: Weekly Congress Trades Report

on:
  schedule:
    # 05:04 UTC every Monday = 08:04 Qatar time (UTC+3, no DST).
    # GitHub Actions cron is always UTC; Qatar = UTC+3, so subtract 3 hours.
    - cron: "4 5 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# allow the workflow to push the weekly heartbeat commit
permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python congress_trades.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: congress-trades-report
          path: reports/*.md
          if-no-files-found: warn

      # Commit the updated portfolio.csv + a heartbeat. The weekly commit also
      # keeps the repo "active" so GitHub never auto-pauses the schedule
      # (it disables crons after 60 idle days).
      - name: Persist portfolio + keep schedule alive
        run: |
          date -u +"Last automated run: %Y-%m-%dT%H:%M:%SZ" > last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt portfolio.csv
          git commit -m "chore: weekly portfolio update + heartbeat [skip ci]" || echo "nothing to commit"
          git push
